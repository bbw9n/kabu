[workspace]
members = ["crates/kabu-core", "crates/kabu-data", "crates/kabu-app"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0.0"
futures-util = "0.3"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSView", "NSWindow"] }
rand = "0.9"
raw-window-handle = "0.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.2.0", default-features = false, features = [
  "auth",
  "client",
  "transport-streamable-http-client-reqwest",
] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots", "url"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
wiremock = "0.6.5"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
